services:
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8082:8080"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5545:5432"
    restart: unless-stopped
