# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names, e.g. "%%(rev)s_%%(slug)s.py"
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library.
# Any required timezone name can be used, such as 'utc' or 'us/central'
# If None, the system's default timezone will be used.
#timezone =

# data file name, used for storing current revision
# revision_environment = false

# set to true to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory
# sourceless = false

# will not use file-stamping on transactional DDL systems
# post_write_hooks =

# This is overridden in env.py, but good to have as a placeholder
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# format using "black" - use "black --help" to see formatting options
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 .


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S