name: Infra Compose CI

on:
  push:
    paths:
      - "infra/**"
      - "scripts/demo-up.sh"
      - "scripts/demo-down.sh"
      - ".github/workflows/infra-compose-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - "scripts/demo-up.sh"
      - "scripts/demo-down.sh"
      - ".github/workflows/infra-compose-ci.yml"
  workflow_dispatch:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config
