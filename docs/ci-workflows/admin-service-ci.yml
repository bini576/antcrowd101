name: Admin Service CI

on:
  push:
    paths:
      - "services/admin-service/**"
      - ".github/workflows/admin-service-ci.yml"
  pull_request:
    paths:
      - "services/admin-service/**"
      - ".github/workflows/admin-service-ci.yml"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin-service/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/admin-service/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/admin-service/Dockerfile services/admin-service
